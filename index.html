<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profil Perangkat Desa</title>
<meta name="base" content="./">
<style>
:root{
  --paper:#fcfbf8; --panel:#ffffff; --ink:#1b2421; --muted:#5d6864; --line:#dcdad2;
  --green:#0e5a44; --mint:#e1f4ec; --amber:#8a5206; --amber-bg:#fbefd9; --red:#a32d2d; --red-bg:#f9e3e1;
  --blue:#2b6a8f; --gold:#9a6a12;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#121715; --panel:#1a211e; --ink:#eae8e1; --muted:#9aa5a0; --line:#2c3632;
    --green:#6fd1ad; --mint:#173a2e; --blue:#7fb4d6; --gold:#e0b25a; --amber:#f0b45a; --amber-bg:#3a2a10; --red:#f08a84; --red-bg:#40201e;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--sans)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.wrap{max-width:66rem;margin:auto;padding:0 clamp(1rem,4vw,2.5rem)}
header{position:relative;text-align:center;padding:2.25rem 0 1.75rem;border-top:4px solid var(--green);border-bottom:1px solid var(--line);
  background:
    radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--green) 14%,transparent) 1px,transparent 0) 0 0/22px 22px,
    linear-gradient(180deg,var(--mint),var(--paper))}
#logo{display:block;height:5rem;width:auto;margin:0 auto .7rem}
h1{font:600 clamp(1.7rem,4vw,2.6rem)/1.1 var(--serif);margin:0 0 .35rem;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0}
.sub:empty{display:none}
#instansi{font-size:1.02rem;letter-spacing:.03em;color:var(--ink);margin-bottom:.55rem}
.stats{display:grid;grid-template-columns:repeat(3,minmax(8.5rem,auto));justify-content:center;gap:1rem;margin-top:1.4rem}
.stats div{--ac:var(--green);padding:.75rem 1.4rem .7rem;border:1px solid var(--line);border-top:3px solid var(--ac);border-radius:10px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--ac) 9%,var(--panel)),var(--panel))}
.stats div:nth-child(2){--ac:var(--blue)}
.stats div:nth-child(3){--ac:var(--gold)}
.stats b{display:block;font:600 2rem/1.1 var(--serif);color:var(--ac)}
.stats span{font-size:.88rem;color:var(--muted)}
main{padding:1.5rem 0 4rem}
.cari{width:100%;padding:.7rem .9rem;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin-bottom:1.5rem}
h2{font:600 1.35rem/1.2 var(--serif);margin:0 0 .75rem}
h2 small{font:400 .9rem var(--sans);color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:.9rem}
.kartu{display:grid;grid-template-columns:3.2rem 1fr;gap:.8rem;align-items:center;text-align:left;padding:.9rem;
  border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.kartu:hover{border-color:var(--green)}
.kartu .dn{font:600 1.15rem/1.2 var(--serif)}
.kartu .kd{font-size:.82rem;color:var(--muted);text-transform:uppercase;overflow-wrap:anywhere}
.kartu .jm{font-size:.82rem;color:var(--green);margin-top:.15rem}
.pic{width:3.2rem;height:4.2rem;border-radius:4px;background:var(--mint);color:var(--green);display:grid;place-items:center;
  font:600 1.05rem var(--serif);overflow:hidden;flex:none}
.pic .avatar{width:72%;height:auto;margin-top:12%;fill:currentColor;opacity:.55}
.pic.kosong-foto{background:none;border:1.5px dashed var(--line);color:var(--muted)}
.pic img{width:100%;height:100%;object-fit:cover}
.back{background:none;border:0;color:var(--green);padding:.25rem 0;margin-bottom:.75rem}
.back:hover{text-decoration:underline}
.kades{display:grid;grid-template-columns:4.5rem 1fr;gap:1rem;align-items:center;width:100%;text-align:left;
  padding:1rem;border:1px solid var(--line);border-radius:10px;background:var(--panel);margin:.5rem 0 1.75rem}
.kades:hover{border-color:var(--green)}
.kades .pic{width:4.5rem;height:6rem;font-size:1.3rem}
.kades .lbl{font-size:.85rem;color:var(--muted)}
.nama{font-weight:600;text-transform:uppercase;overflow-wrap:anywhere}
.jab{color:var(--muted);font-size:.9rem}
.komp{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1.5rem}
.komp span{padding:.25rem .7rem;border-radius:99px;background:var(--mint);color:var(--green);font-size:.88rem}
.grp{margin-bottom:1.5rem}
ul.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
ul.list li{border-bottom:1px solid var(--line)}
.row{display:grid;grid-template-columns:auto 1fr;gap:.9rem;align-items:center;width:100%;padding:.55rem .3rem;background:none;border:0;text-align:left}
button.row:hover{background:var(--panel)}
.row .pic{width:2.4rem;height:3.1rem;font-size:.9rem}
.lowong .nama{color:var(--muted);font-weight:400;text-transform:none;font-style:italic}
.lencana{display:flex;flex-wrap:wrap;gap:.35rem;margin-top:.5rem}
.badge{font-size:.78rem;padding:.1rem .6rem;border-radius:99px;background:var(--amber-bg);color:var(--amber);overflow-wrap:anywhere}
.badge.ok{background:var(--mint);color:var(--green)}
.dtag{color:var(--green);font-size:.85rem}
.kosong{padding:1.5rem .3rem;color:var(--muted)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(34rem,94vw)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{display:grid;grid-template-columns:8rem 1fr;gap:1.25rem;padding:1.5rem}
.dlg .pic{width:8rem;height:10.5rem;font-size:2rem}
.dlg h3{font:600 1.3rem/1.2 var(--serif);margin:0 0 .15rem;text-transform:uppercase;overflow-wrap:anywhere}
dl{margin:.9rem 0 0;display:grid;grid-template-columns:auto 1fr;gap:.3rem .9rem;font-size:.92rem}
dt{color:var(--muted)} dd{margin:0;overflow-wrap:anywhere}
.acts{display:flex;justify-content:flex-end;gap:.5rem;padding:0 1.5rem 1.25rem}
.acts button{padding:.45rem 1.1rem;border:1px solid var(--line);border-radius:8px;background:none}
.dash{display:grid;grid-template-columns:1.15fr 1fr;gap:.9rem;margin-bottom:2rem}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:1rem 1.15rem}
.panel h3{text-align:center;font:600 .8rem var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 .85rem}
.bar{display:grid;grid-template-columns:10.2rem 1fr 2rem;gap:.6rem;align-items:center;font-size:.88rem;margin:.4rem 0}
.bar .bt{height:.55rem;background:var(--mint);border-radius:99px;overflow:hidden}
.bar .bt i{display:block;height:100%;background:var(--green);border-radius:99px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.kolom{display:flex;gap:.9rem;align-items:flex-end;height:9rem}
.kol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:.85rem}
.kol b{font-variant-numeric:tabular-nums;margin-bottom:.25rem}
.kol .kt{display:flex;align-items:flex-end;width:100%;flex:1;max-height:6rem;background:linear-gradient(var(--line),var(--line)) center bottom/1px 100% no-repeat}
.kol .kt i{display:block;width:100%;background:var(--green);border-radius:4px 4px 0 0;opacity:.9}
.kol em{font-style:normal;color:var(--muted);margin-top:.35rem;font-size:.8rem}
.cat{text-align:center;margin:.8rem 0 0;font-size:.78rem;color:var(--muted)}
.info{margin-top:2.25rem;padding-top:1.25rem;border-top:1px solid var(--line)}
.info h2{font-size:1.05rem;color:var(--muted)}
ul.ultah{list-style:none;margin:0;padding:0;columns:2 19rem;column-gap:2rem;font-size:.9rem}
ul.ultah li{break-inside:avoid;display:grid;grid-template-columns:auto 1fr;gap:.1rem .7rem;padding:.35rem 0;align-items:baseline}
.hr{grid-row:span 2;min-width:2.2rem;text-align:center;font:600 .9rem var(--serif);color:var(--green);background:var(--mint);border-radius:6px;padding:.15rem .3rem}
.lk{background:none;border:0;padding:0;text-align:left;text-transform:uppercase;font-weight:600;font-size:.85rem}
.lk:hover{color:var(--green);text-decoration:underline}
.ket{color:var(--muted);font-size:.8rem;text-transform:capitalize}
.ket .st{text-transform:none;font-style:italic}
.pens{font-size:.82rem;color:var(--muted);margin:.5rem 0 0}
.stats small{display:block;font-size:.78rem;color:var(--muted)}
@media (max-width:40rem){.dash{grid-template-columns:1fr}.bar{grid-template-columns:6.8rem 1fr 2rem}}
.cekl{margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--line)}
.cekl h2{text-align:center;margin-bottom:.2rem}
.cekl .ring{text-align:center;color:var(--muted);font-size:.82rem;margin:0 0 1rem}
table.cl{width:100%;border-collapse:collapse}
.cl th{font-size:.7rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:center;padding:.5rem .5rem;border-bottom:1px solid var(--ink)}
.cl th:first-child,.cl td:first-child{text-align:left}
.cl td{padding:.55rem .5rem;border-bottom:1px solid var(--line);vertical-align:middle}
.cl td:not(:first-child){text-align:center;white-space:nowrap;width:8.5rem}
.cl tbody tr:hover{background:var(--panel)}
.ck{display:inline-flex;align-items:center;gap:.45rem;font-size:.85rem}
.ck::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:currentColor}
.ck.ya{color:var(--green)}
.ck.tdk{color:var(--muted)}
.ck.tdk::before{background:none;box-shadow:inset 0 0 0 1.5px currentColor}
.ck.kos{color:var(--muted)}
.ck.kos::before{display:none}
.sl-box{max-width:28rem;margin:0 auto;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.sl{display:flex;justify-content:space-between;gap:1rem;align-items:baseline;padding:.7rem 1.1rem;border-bottom:1px solid var(--line);font-size:.92rem}
.sl:last-child{border-bottom:0}
.sl span{color:var(--muted)}
.sl b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.sl.pos{background:color-mix(in srgb,var(--green) 8%,var(--panel))}
.sl.pos b,.sl.pos span{color:var(--green)}
.sl.neg{background:color-mix(in srgb,var(--red) 8%,var(--panel))}
.sl.neg b,.sl.neg span{color:var(--red)}
footer{padding:2.5rem 0 2.75rem;text-align:center}
.orn{display:flex;align-items:center;justify-content:center;gap:.8rem;color:var(--green);font-size:.55rem;margin-bottom:.9rem}
.orn::before,.orn::after{content:"";width:5.5rem;height:1px;background:linear-gradient(90deg,transparent,var(--line))}
.orn::after{transform:scaleX(-1)}
.fl{font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.fd{font:italic 400 1.1rem/1.4 var(--serif);color:var(--ink);margin-top:.15rem}
@media (max-width:40rem){.dash{grid-template-columns:1fr}.bar{grid-template-columns:6.8rem 1fr 2rem}}
@media (max-width:40rem){.dlg{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr;gap:.75rem}.stats div:first-child{grid-column:1/-1}}
</style>
</head>
<body>
<header><div class="wrap">
  <img id="logo" alt="Lambang Pemerintah Kabupaten Probolinggo" onerror="this.remove()">
  <p class="sub" id="instansi"></p>
  <h1 id="judul">Profil Perangkat Desa</h1>
  <p class="sub" id="sub">Memuat data…</p>
  <div class="stats" id="stats"></div>
</div></header>

<div class="wrap">
  <main id="isi"></main>
  <footer id="foot"></footer>
</div>
<dialog id="dlg" aria-label="Profil"></dialog>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === "class") e.className = v; else if (k === "text") e.textContent = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) e.append(c);
  return e;
};
const tgl = (iso) => iso ? new Date(iso + "T00:00:00").toLocaleDateString("id-ID", {day: "numeric", month: "long", year: "numeric"}) : null;
const inisial = (n) => n.split(/\s+/).filter(Boolean).slice(0, 2).map(s => s[0]).join("").toUpperCase();
const ORDE = ["Sekretaris Desa", "Kasi", "Kaur", "Kepala Dusun", "Perangkat Desa", "Staf"];
const JUDUL = {Kasi: "Kepala Seksi", Kaur: "Kepala Urusan", Staf: "Staf Perangkat Desa"};
const judul = (g) => JUDUL[g] || g;
const BULAN = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
const tglPendek = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("id-ID", {day: "numeric", month: "short"});

const BASE = new URL((document.querySelector('meta[name="base"]') || {}).content || "./", location.href).href;
const slugSekarang = () => decodeURIComponent(location.pathname.slice(new URL(BASE).pathname.length).split("/")[0] || "");
function go(slug) { history.pushState({}, "", BASE + (slug ? slug + "/" : "")); rute(); }

let DATA, query = "";
const aktif = (p) => !p.lowong && p.pensiun_status !== "lewat";
// Kepala Dusun bernomor romawi (Krajan I, II, ...) tidak dipertahankan bila pensiun; jabatan lain tetap tampil sebagai lowong
const romawi = (p) => p.kelompok === "Kepala Dusun" && /\s(?:I{1,3}|IV|VI{0,3}|IX|X)$/i.test((p.jabatan || "").trim());
const terlihat = (p) => p.lowong || aktif(p) || (p.pensiun_status === "lewat" && !romawi(p));
const sebagaiLowong = (p) => (p.lowong || aktif(p)) ? p : {...p, nama: null, lowong: true, foto: null, usia: null};
const kades = (d) => d.perangkat.find(p => p.kelompok === "Kepala Desa");
const anggota = (d) => d.perangkat.filter(p => p.kelompok !== "Kepala Desa");
const hitung = (d) => {
  const a = anggota(d).filter(aktif);
  const staf = a.filter(p => p.kelompok === "Staf").length;
  return {perangkat: a.length - staf, staf};
};
const semuaAktif = () => DATA.desa.flatMap(d => d.perangkat.filter(aktif).map(p => [p, d]));
const ketHitung = (h) => h.perangkat + " perangkat desa" + (h.staf ? " & " + h.staf + " staf perangkat" : "");

function avatar() {
  const NS = "http://www.w3.org/2000/svg";
  const s = document.createElementNS(NS, "svg");
  s.setAttribute("viewBox", "0 0 64 80"); s.setAttribute("aria-hidden", "true"); s.setAttribute("class", "avatar");
  const kepala = document.createElementNS(NS, "circle");
  kepala.setAttribute("cx", "32"); kepala.setAttribute("cy", "29"); kepala.setAttribute("r", "13");
  const bahu = document.createElementNS(NS, "path");
  bahu.setAttribute("d", "M6 80C6 59 19 50 32 50S58 59 58 80Z");
  s.append(kepala, bahu);
  return s;
}

function pic(p) {
  const d = el("div", {class: "pic"});
  if (p && p.lowong) { d.classList.add("kosong-foto"); d.textContent = "–"; return d; }
  if (p && p.foto) {
    const img = el("img", {src: BASE + p.foto, alt: "Foto " + p.nama, loading: "lazy"});
    img.addEventListener("error", () => img.replaceWith(avatar()));
    d.append(img);
  } else d.append(avatar());
  return d;
}

function profil(p, d) {
  const dl = el("dl");
  const f = (k, v) => { if (v) dl.append(el("dt", {text: k}), el("dd", {text: v})); };
  f("Desa", d.nama);
  f("Usia", p.usia != null ? p.usia + " tahun" : null);
  f("Jenis kelamin", p.jenis_kelamin);
  f("Pendidikan", p.pendidikan);
  f("Agama", p.agama);
  f("Status", p.status);
  dl.append(el("dt", {text: "SK Pengangkatan"}), el("dd", {text: p.sk_pengangkatan || "-"}));
  dl.append(el("dt", {text: "TMT Pengangkatan"}), el("dd", {text: tgl(p.tmt) || "-"}));
  dl.append(el("dt", {text: "SK Jabatan Terakhir"}), el("dd", {text: p.sk_terakhir || "-"}));
  dl.append(el("dt", {text: "Kinerja/Penghargaan"}), el("dd", {}, p.kinerja ? p.kinerja.map(k => el("div", {text: k})) : "-"));
  dl.append(el("dt", {text: "Riwayat Pembinaan"}), el("dd", {text: p.pembinaan ? "Ada" : "-"}));
  const nomor = (p.telepon || "").replace(/[^\d+]/g, "");
  dl.append(el("dt", {text: "Telepon"}), el("dd", {}, nomor ? el("a", {href: "tel:" + nomor, text: p.telepon}) : "-"));
  const lencana = [];
  if (p.pensiun_status) lencana.push(el("span", {class: "badge", text: "Pensiun " + tgl(p.pensiun)}));
  for (const k of p.kinerja || []) lencana.push(el("span", {class: "badge ok", text: k}));
  const dlg = $("dlg");
  const lihat = slugSekarang() !== d.slug
    ? el("button", {text: "Lihat desa", onclick: () => { dlg.close(); go(d.slug); }}) : null;
  dlg.replaceChildren(
    el("div", {class: "dlg"}, pic(p), el("div", {},
      el("h3", {text: p.nama}), el("div", {class: "jab", text: p.jabatan}),
      lencana.length ? el("div", {class: "lencana"}, lencana) : null, dl)),
    el("div", {class: "acts"}, lihat, el("button", {text: "Tutup", onclick: () => dlg.close()})));
  dlg.showModal();
}

function barisOrang(p, d, tampilDesa) {
  const isi = [pic(p), el("div", {},
    el("div", {class: "nama", text: p.lowong ? "Belum terisi" : p.nama}),
    el("div", {class: "jab", text: p.jabatan}),
    tampilDesa ? el("div", {class: "dtag", text: "Desa " + d.nama}) : null)];
  return el("li", {class: p.lowong ? "lowong" : ""},
    p.lowong ? el("div", {class: "row"}, isi)
             : el("button", {class: "row", "aria-label": "Profil " + p.nama, onclick: () => profil(p, d)}, isi));
}

function kartuDesa(d) {
  const k = kades(d);
  return el("button", {class: "kartu", onclick: () => go(d.slug)},
    pic(k),
    el("div", {},
      el("div", {class: "dn", text: d.nama}),
      el("div", {class: "kd", text: k && !k.lowong ? k.nama : "Kepala desa belum terisi"}),
      el("div", {class: "jm", text: ketHitung(hitung(d))})));
}

/* ---------- dasbor ---------- */
function panel(judul, isi, catatan) {
  return el("section", {class: "panel"}, el("h3", {text: judul}), isi, catatan ? el("p", {class: "cat", text: catatan}) : null);
}

function dasbor() {
  const orang = semuaAktif();
  const baris = ["Kepala Desa", ...ORDE.filter(g => g !== "Perangkat Desa")].map(g => [judul(g), orang.filter(([p]) => p.kelompok === g).length]);
  const mx = Math.max(...baris.map(b => b[1]), 1);
  const struktur = el("div", {}, baris.map(([g, n]) => el("div", {class: "bar"},
    el("span", {text: g}), el("span", {class: "bt"}, el("i", {style: `width:${n / mx * 100}%`})), el("b", {text: String(n)}))));

  const usia = orang.map(([p]) => p.usia).filter(u => u != null);
  const pita = [["< 30", 0, 29], ["30–39", 30, 39], ["40–49", 40, 49], ["50+", 50, 200]]
    .map(([l, a, b]) => [l, usia.filter(u => u >= a && u <= b).length]);
  const mu = Math.max(...pita.map(x => x[1]), 1);
  const sebaran = el("div", {class: "kolom"}, pita.map(([l, n]) => el("div", {class: "kol"},
    el("b", {text: String(n)}), el("span", {class: "kt"}, el("i", {style: `height:${n / mu * 100}%`})), el("em", {text: l}))));

  return el("div", {class: "dash"},
    panel("Jumlah per struktur", struktur),
    panel("Sebaran usia", sebaran));
}

/* ---------- info bawah ---------- */
function ulangTahun() {
  const l = semuaAktif().filter(([p]) => p.ultah_hari)
    .sort((a, b) => a[0].ultah_hari - b[0].ultah_hari || a[0].nama.localeCompare(b[0].nama));
  if (!l.length) return null;
  return el("section", {class: "info"},
    el("h2", {}, "Ulang tahun bulan " + BULAN[DATA.bulan - 1] + " ", el("small", {text: "(" + l.length + ")"})),
    el("ul", {class: "ultah"}, l.map(([p, d]) => el("li", {},
      el("span", {class: "hr", text: String(p.ultah_hari)}),
      el("button", {class: "lk", text: p.nama, onclick: () => profil(p, d)}),
      el("span", {class: "ket", text: `${p.jabatan.toLowerCase()} · Desa ${d.nama} · ${p.ultah_usia} th`})))));
}

function pensiunTahunIni() {
  const th = String(DATA.tahun);
  const l = DATA.desa.flatMap(d => d.perangkat.filter(p => p.pensiun && p.pensiun.startsWith(th)).map(p => [p, d]))
    .sort((a, b) => a[0].pensiun.localeCompare(b[0].pensiun));
  if (!l.length) return null;
  return el("section", {class: "info"},
    el("h2", {}, "Daftar Pensiun tahun " + th + " ", el("small", {text: "(" + l.length + ")"})),
    el("ul", {class: "ultah"}, l.map(([p, d]) => el("li", {},
      el("span", {class: "hr", style: "font-size:.78rem", text: tglPendek(p.pensiun)}),
      el("button", {class: "lk", text: p.nama, onclick: () => profil(p, d)}),
      el("span", {class: "ket"}, `${p.jabatan.toLowerCase()} · Desa ${d.nama} · `,
        el("span", {class: "st", text: p.pensiun_status === "lewat" ? "sudah pensiun" : "akan pensiun"}))))));
}

function beranda() {
  const q = query.trim().toLowerCase();
  const cari = el("input", {class: "cari", type: "search", value: query, "aria-label": "Cari desa, nama, atau jabatan",
    placeholder: "Cari desa, nama, atau jabatan"});
  cari.addEventListener("input", () => {
    query = cari.value; const pos = cari.selectionStart; beranda(); const n = $("isi").querySelector("input"); n.focus(); n.setSelectionRange(pos, pos);
  });
  const bagian = [cari];
  if (!q) {
    bagian.push(dasbor(),
      el("h2", {}, "Desa ", el("small", {text: "(" + DATA.desa.length + ")"})),
      el("div", {class: "grid"}, DATA.desa.map(kartuDesa)),
      ulangTahun(), pensiunTahunIni());
  } else {
    const desa = DATA.desa.filter(d => d.nama.toLowerCase().includes(q));
    const orang = semuaAktif().filter(([p]) => (p.nama + " " + p.jabatan).toLowerCase().includes(q));
    if (desa.length) bagian.push(el("h2", {}, "Desa ", el("small", {text: "(" + desa.length + ")"})), el("div", {class: "grid", style: "margin-bottom:1.5rem"}, desa.map(kartuDesa)));
    if (orang.length) bagian.push(el("h2", {}, "Orang ", el("small", {text: "(" + orang.length + ")"})), el("ul", {class: "list"}, orang.map(([p, d]) => barisOrang(p, d, true))));
    if (!desa.length && !orang.length) bagian.push(el("p", {class: "kosong", text: "Tidak ada yang cocok. Coba nama desa, nama orang, atau jabatan lain."}));
  }
  $("isi").replaceChildren(...bagian.filter(Boolean));
}

function halamanDesa(d) {
  const k = kades(d);
  const per = {};
  for (const p of anggota(d).filter(terlihat).map(sebagaiLowong)) (per[p.kelompok] ||= []).push(p);
  const urut = ORDE.filter(g => per[g]);
  const jml = (g) => per[g].filter(aktif).length;
  const komposisi = urut.map(g => el("span", {text: judul(g) + " " + jml(g)}));
  const h = hitung(d);
  const pens = d.perangkat.filter(p => p.pensiun_status === "lewat");
  $("isi").replaceChildren(...[
    el("button", {class: "back", text: "‹ Semua desa", onclick: () => go("")}),
    el("h2", {text: "Desa " + d.nama, style: "font-size:1.9rem"}),
    k ? (k.lowong
      ? el("div", {class: "kades"}, pic(k), el("div", {}, el("div", {class: "lbl", text: "Kepala Desa"}), el("div", {class: "nama", style: "font-weight:400;font-style:italic;color:var(--muted)", text: "Belum terisi"})))
      : el("button", {class: "kades", "aria-label": "Profil " + k.nama, onclick: () => profil(k, d)}, pic(k),
          el("div", {}, el("div", {class: "lbl", text: k.jabatan}), el("div", {class: "nama", text: k.nama}), el("div", {class: "jab", text: k.usia != null ? k.usia + " tahun" : ""}))))
      : null,
    el("h2", {}, "Perangkat desa ", el("small", {text: "(" + h.perangkat + (h.staf ? " & " + h.staf + " staf perangkat" : "") + ")"})),
    el("div", {class: "komp"}, komposisi),
    ...urut.map(g => el("section", {class: "grp"},
      el("h2", {style: "font-size:1.1rem"}, judul(g), " ", el("small", {text: "(" + jml(g) + ")"})),
      el("ul", {class: "list"}, per[g].map(p => barisOrang(p, d, false))))),
    checklistSK(per),
    pagu(d),
    pens.length ? el("p", {class: "pens", text: "Pensiun: " + pens.map(p => `${p.nama} (${tgl(p.pensiun)})`).join("; ") + "."}) : null].filter(Boolean));
}

function checklistSK(per) {
  const daftar = ORDE.flatMap(g => (per[g] || []).filter(aktif));
  if (!daftar.length) return null;
  const sel = (v) => el("span", {class: "ck " + (v === true ? "ya" : v === false ? "tdk" : "kos"), text: v === true ? "Ada" : v === false ? "Tidak ada" : "–"});
  const n1 = daftar.filter(p => p.scan_pengangkatan === true).length;
  const n2 = daftar.filter(p => p.scan_terakhir === true).length;
  return el("section", {class: "cekl"},
    el("h2", {text: "Checklist pemenuhan Scan SK"}),
    el("p", {class: "ring", text: `SK Pengangkatan ${n1} dari ${daftar.length} · SK Jabatan Terakhir ${n2} dari ${daftar.length}`}),
    el("table", {class: "cl"},
      el("thead", {}, el("tr", {}, el("th", {text: "Nama"}), el("th", {text: "SK Pengangkatan"}), el("th", {text: "SK Jabatan Terakhir"}))),
      el("tbody", {}, daftar.map(p => el("tr", {},
        el("td", {}, el("div", {class: "nama", text: p.nama}), el("div", {class: "jab", style: "text-transform:capitalize", text: p.jabatan.toLowerCase()})),
        el("td", {}, sel(p.scan_pengangkatan)),
        el("td", {}, sel(p.scan_terakhir)))))));
}

const rp = (n) => (n < 0 ? "−" : "") + "Rp " + Math.abs(n).toLocaleString("id-ID");

function pagu(d) {
  const s = d.siltap;
  if (!s) return null;
  const baris = (label, nilai, kelas) => el("div", {class: "sl " + (kelas || "")}, el("span", {text: label}), el("b", {text: nilai}));
  return el("section", {class: "cekl pagu"},
    el("h2", {text: "Ketersediaan Pagu Siltap"}),
    el("div", {class: "sl-box"},
      baris("Pagu Siltap + SILPA Tahun Sebelumnya", s.pagu == null ? "–" : rp(s.pagu)),
      baris("Estimasi Kebutuhan", rp(s.kebutuhan)),
      baris("Estimasi SILPA Siltap", s.silpa == null ? "–" : rp(s.silpa), s.silpa == null ? "" : s.silpa < 0 ? "neg" : "pos")));
}

function rute() {
  $("dlg").open && $("dlg").close();
  const lama = location.hash.match(/^#\/desa\/(.+)$/);  // alamat gaya lama
  if (lama) history.replaceState({}, "", BASE + decodeURIComponent(lama[1]) + "/");
  const slug = slugSekarang();
  const d = slug && DATA.desa.find(x => x.slug === slug);
  if (slug && !d) history.replaceState({}, "", BASE);
  if (d) { document.title = `Desa ${d.nama} - Profil Perangkat Desa`; halamanDesa(d); }
  else { document.title = `Profil Perangkat Desa Kecamatan ${DATA.kecamatan}`; beranda(); }
  window.scrollTo(0, 0);
}

function pasang(d) {
  DATA = d;
  $("judul").replaceChildren("Profil Perangkat Desa", el("br"), "Kecamatan " + d.kecamatan);
  $("instansi").textContent = d.instansi || "";
  $("sub").textContent = "";
  const lg = $("logo");
  if (lg) {
    lg.addEventListener("load", () => { const ic = document.createElement("link"); ic.rel = "icon"; ic.href = BASE + "logo.png"; document.head.append(ic); });
    lg.src = BASE + "logo.png";
  }
  const tot = d.desa.reduce((a, x) => { const h = hitung(x); return {perangkat: a.perangkat + h.perangkat, staf: a.staf + h.staf}; }, {perangkat: 0, staf: 0});
  $("stats").replaceChildren(
    ...[[d.desa.length, "desa"], [tot.perangkat, "perangkat desa"], [tot.staf, "staf perangkat"]]
      .map(([n, t]) => el("div", {}, el("b", {text: String(n)}), el("span", {text: t}))));
  $("foot").replaceChildren(el("div", {class: "orn", "aria-hidden": "true", text: "◆"}), el("div", {class: "fl", text: "Data per"}), el("div", {class: "fd", text: tgl(d.data_per || d.diperbarui)}));
  window.addEventListener("popstate", rute);
  rute();
}

fetch(BASE + "data.json").then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(pasang)
  .catch(() => { $("sub").textContent = "Data belum bisa dimuat. Muat ulang halaman, atau hubungi operator kecamatan."; });
</script>
</body>
</html>
